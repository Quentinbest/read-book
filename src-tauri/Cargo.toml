[package]
name = "linen"
version = "0.3.0"
description = "Linen, a quiet EPUB reader"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "linen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
quick-xml = "0.42"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
semver = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
tauri-plugin-updater = "2"
# Already in the tree through tauri; the updater's daily timer (D6).
tokio = { version = "1", features = ["time"] }
flate2 = "1"
ripemd = "0.1"
encoding_rs = "0.8"
unicode-normalization = "0.1"
ammonia = "4"
security-framework = "3"

[features]
# Phase 0 spike harness (docs/spikes/). Never enabled in product builds.
spikes = []

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSWorkspace", "NSPasteboard", "NSAccessibility", "NSEvent", "NSApplication", "NSResponder", "NSWindow", "NSGraphics", "NSButton", "NSControl", "NSView", "NSAlert", "NSTextField", "NSSecureTextField", "NSRunningApplication"] }
block2 = "0.6"
objc2 = "0.6"
libc = "0.2"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "objc2-core-foundation", "NSUserDefaults", "NSString", "NSArray", "NSLocale", "NSBundle"] }
