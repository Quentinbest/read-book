name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, type-check, design export
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      # Fails when docs/design/text/ no longer matches the design bundles (plan §5, Phase 0).
      - run: pnpm design:check

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS only for now (owner decision, 2026-09-24). Add windows-latest and
        # ubuntu-22.04 (WebKitGTK 4.1, plan D7) when those platforms resume.
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux WebView and build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential
      # The version, components and targets come from rust-toolchain.toml, as locally.
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # Plan §6.2: the public and generated corpus (hostile, broken and large books).
      # The downloads are hash-verified and cached until the manifest changes.
      - uses: actions/cache@v4
        with:
          path: corpus/cache
          key: corpus-${{ hashFiles('corpus/manifest.json') }}
      - name: Test corpus
        run: |
          python3 scripts/corpus/fetch.py
          python3 scripts/corpus/generate.py
      - name: Rust tests
        env:
          LINEN_REQUIRE_CORPUS: '1'
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build app
        run: pnpm tauri build --debug --no-bundle

  integration:
    name: Integration tests (Chromium, WebKit)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium webkit
      - run: pnpm test:integration
